name: 'Guix Mirror'
on:
  push:
    branches:
        - __mirror
  schedule:
    - cron: '1 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    name: mirror
    steps:
      - name: mirror
        id: mirror
        uses: bridgelightcloud/github-mirror-action@v3
        with:
          origin: 'https://codeberg.org/guix/guix.git'
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
